# Only the ingress controller and the CronJob may reach the app pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: medlink-ingress
  namespace: medlink
spec:
  podSelector:
    matchLabels: { app: medlink }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - podSelector: {} # pods of the medlink namespace (CronJob)
      ports:
        - { port: 3000 }
