# Adds pods under load (2 to 5), based on CPU. Needs metrics-server in the cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medlink
  namespace: medlink
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: medlink }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
