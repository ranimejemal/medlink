# OPTIONAL, for a real cluster with a domain name (not used by kind / k8s-up.ps1).
# HTTPS entry point (US-44): needs an ingress controller (ingress-nginx) and cert-manager with a
# ClusterIssuer named "letsencrypt". Replace the host, set PUBLIC_URL in k8s/base/config.yaml to
# https://<host>, then:  kubectl apply -f k8s/ingress.example.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medlink
  namespace: medlink
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "12m" # documents up to 10 MB
spec:
  ingressClassName: nginx
  tls:
    - hosts: [medlink.example.tn]
      secretName: medlink-tls
  rules:
    - host: medlink.example.tn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }
