# Supabase REST API (PostgREST): the tables and RPC functions, protected by Row Level Security.
# 2 replicas on different servers; stateless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest
  namespace: medlink
  labels: { app: rest, tier: supabase }
spec:
  replicas: 2
  selector: { matchLabels: { app: rest } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: rest, tier: supabase } }
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - {
            maxSkew: 1,
            topologyKey: kubernetes.io/hostname,
            whenUnsatisfiable: ScheduleAnyway,
            labelSelector: { matchLabels: { app: rest } },
          }
      containers:
        - name: rest
          image: postgrest/postgrest:v12.2.12
          ports: [{ name: http, containerPort: 3000 }, { name: admin, containerPort: 3001 }]
          env:
            - {
                name: AUTHENTICATOR_PASSWORD,
                valueFrom:
                  { secretKeyRef: { name: medlink-supabase, key: AUTHENTICATOR_PASSWORD } },
              }
            - {
                name: PGRST_JWT_SECRET,
                valueFrom: { secretKeyRef: { name: medlink-supabase, key: JWT_SECRET } },
              }
            - {
                name: PGRST_APP_SETTINGS_JWT_SECRET,
                valueFrom: { secretKeyRef: { name: medlink-supabase, key: JWT_SECRET } },
              }
            - {
                name: PGRST_DB_URI,
                value: "postgres://authenticator:$(AUTHENTICATOR_PASSWORD)@medlink-db-rw:5432/postgres",
              }
            - { name: PGRST_DB_SCHEMAS, value: "public,storage,graphql_public" }
            - { name: PGRST_DB_ANON_ROLE, value: anon }
            - { name: PGRST_DB_USE_LEGACY_GUCS, value: "false" }
            - { name: PGRST_APP_SETTINGS_JWT_EXP, value: "3600" }
            - { name: PGRST_ADMIN_SERVER_PORT, value: "3001" }
          readinessProbe:
            httpGet: { path: /ready, port: admin }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /live, port: admin }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: rest, namespace: medlink }
spec:
  selector: { app: rest }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: rest, namespace: medlink }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: rest } }
