# Mailpit: catches every e-mail sent by the demo cluster (sign-up codes, password reset,
# appointment confirmations and reminders) and shows them at http://127.0.0.1:8025.
# No real mailbox needed for the demo. To send real e-mails, set SMTP_* when generating the
# secrets (scripts/k8s-secrets.mjs) and remove this file from kustomization.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: medlink
  labels: { app: mailpit, tier: tools }
spec:
  replicas: 1
  selector: { matchLabels: { app: mailpit } }
  template:
    metadata: { labels: { app: mailpit, tier: tools } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.27
          ports: [{ name: smtp, containerPort: 1025 }, { name: http, containerPort: 8025 }]
          env:
            - { name: MP_SMTP_AUTH_ACCEPT_ANY, value: "true" }
            - { name: MP_SMTP_AUTH_ALLOW_INSECURE, value: "true" }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: mailpit, namespace: medlink }
spec:
  type: NodePort
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: http, port: 8025, targetPort: http, nodePort: 30025 }
