# EXAMPLE ONLY: never put real values in Git (US-45).
# Create the real Secret from your .env file instead:
#   kubectl -n medlink create secret generic medlink-secrets --from-env-file=.env
# The Deployment reads these keys:
apiVersion: v1
kind: Secret
metadata:
  name: medlink-secrets
  namespace: medlink
type: Opaque
stringData:
  SUPABASE_PUBLISHABLE_KEY: "sb_publishable_..."
  SUPABASE_SERVICE_ROLE_KEY: "sb_secret_..."
  CRON_SECRET: "..."
  AI_API_KEY: "..."
  SMTP_USER: "..."
  SMTP_PASS: "..."
  SMTP_FROM: "MedLink <no-reply@example.tn>"
