# Creates the Supabase schema, applies the MedLink migrations and loads the demo data.
# Runs once after "kubectl apply -k k8s"; safe to run again after a new migration:
#   kubectl -n medlink delete job medlink-db-init; kubectl apply -k k8s
apiVersion: batch/v1
kind: Job
metadata:
  name: medlink-db-init
  namespace: medlink
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata: { labels: { app: medlink-db-init } }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: init
          # Official Supabase Postgres image (already used by the database: nothing to build or
          # load into the cluster); the MedLink scripts and migrations come from ConfigMaps.
          image: supabase/postgres:15.8.1.085
          command: ["/bin/sh", "/medlink/bin/init.sh"]
          securityContext: { runAsUser: 105, runAsGroup: 106, allowPrivilegeEscalation: false }
          env:
            - { name: SEED_FILE, value: /medlink/bin/seed.sql }
            - { name: MIGRATIONS_DIR, value: /medlink/migrations }
            - { name: PGHOST, value: medlink-db-rw }
            - { name: AUTH_URL, value: "http://auth:9999" }
            - {
                name: SUPERUSER_PASSWORD,
                valueFrom: { secretKeyRef: { name: medlink-db-superuser, key: password } },
              }
            - {
                name: SUPABASE_ADMIN_PASSWORD,
                valueFrom:
                  { secretKeyRef: { name: medlink-supabase, key: SUPABASE_ADMIN_PASSWORD } },
              }
            - {
                name: AUTH_DB_PASSWORD,
                valueFrom: { secretKeyRef: { name: medlink-supabase, key: AUTH_DB_PASSWORD } },
              }
            - {
                name: STORAGE_DB_PASSWORD,
                valueFrom: { secretKeyRef: { name: medlink-supabase, key: STORAGE_DB_PASSWORD } },
              }
            - {
                name: AUTHENTICATOR_PASSWORD,
                valueFrom:
                  { secretKeyRef: { name: medlink-supabase, key: AUTHENTICATOR_PASSWORD } },
              }
            - {
                name: SERVICE_ROLE_KEY,
                valueFrom: { secretKeyRef: { name: medlink-supabase, key: SERVICE_ROLE_KEY } },
              }
            - {
                name: DEMO_PASSWORD,
                valueFrom: { configMapKeyRef: { name: medlink-config, key: DEMO_PASSWORD } },
              }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: scripts, mountPath: /medlink/bin, readOnly: true }
            - { name: migrations, mountPath: /medlink/migrations, readOnly: true }
      volumes:
        # Created by scripts/k8s-up.ps1 from docker/db-init/*.sh, supabase/seed.sql and
        # supabase/migrations (kubectl create configmap ... --from-file).
        - name: scripts
          configMap: { name: medlink-db-scripts }
        - name: migrations
          configMap: { name: medlink-migrations }
