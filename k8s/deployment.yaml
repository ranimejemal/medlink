# The MedLink app (interface + server, one Node.js image). 2 replicas on different nodes:
# if a pod or a server goes down, the other keeps serving and Kubernetes recreates the lost one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medlink
  namespace: medlink
  labels: { app: medlink }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: medlink }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # zero-downtime updates
  template:
    metadata:
      labels: { app: medlink }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "node" user of the image
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: medlink }
      containers:
        - name: app
          # Built and pushed by .github/workflows/docker.yml. Pin a version tag (sha-xxxxxxx) in production.
          image: ghcr.io/ranimejemal/medlink:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: medlink-config }
            - secretRef: { name: medlink-secrets }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          # Restarted if the process hangs.
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Removed from the Service while the database cannot be reached.
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
