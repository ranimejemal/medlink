# Apply everything:  kubectl apply -k k8s/
# (create the Secret first, see secret.example.yaml)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - cronjob.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
