apiVersion: v1
kind: Namespace
metadata:
  name: medlink
  labels:
    # Pod Security Standards: no privileged containers in this namespace.
    pod-security.kubernetes.io/enforce: baseline
---
# Non-secret settings. Secrets (keys, passwords) are generated by scripts/k8s-secrets.mjs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: medlink-config
  namespace: medlink
data:
  # Address of the site in the browser (kind maps it to port 8080, see k8s/kind/cluster.yaml).
  # scripts/k8s-up.ps1 replaces it with the port actually used (8080, or another free one).
  PUBLIC_URL: "http://127.0.0.1:8080"
  # Password of the 4 demo accounts created by the init Job (fictional accounts, demo only).
  DEMO_PASSWORD: "MedLink-Demo-2026!"
  NODE_ENV: "production"
  AI_BASE_URL: "https://api.openai.com/v1"
  AI_MODEL: "gpt-4o-mini"
