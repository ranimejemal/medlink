# Builds the 3 MedLink container images used by Kubernetes (k8s/):
#   ghcr.io/<owner>/medlink-frontend  pages of the app (nginx) + entry point of the site
#   ghcr.io/<owner>/medlink-backend   Node.js server (server functions, /api)
#   ghcr.io/<owner>/medlink-db-init   database set-up job (Supabase schema, migrations, demo data)
# Pull requests: build only (checks the Dockerfiles). Push on main: build and publish.
# No build-time secret or setting: the public keys are read at run time (/env.js).
name: Docker images

on:
  push:
    branches: [main]
  pull_request:
    paths:
      [
        "docker/**",
        "src/**",
        "supabase/**",
        "package*.json",
        "vite.config.ts",
        ".github/workflows/docker.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [medlink-frontend, medlink-backend, medlink-db-init]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.name == 'medlink-db-init' && 'db-init' || (matrix.name == 'medlink-frontend' && 'frontend' || 'backend') }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The Kubernetes files must stay valid (kustomize build + schema check).
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize k8s > /tmp/medlink.yaml && echo "$(grep -c '^kind:' /tmp/medlink.yaml) objects"
